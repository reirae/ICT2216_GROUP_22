version: 2
updates:
  # Backend Node.js dependencies
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'natlionggg'
    labels:
      - 'dependencies'
      - 'backend'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'

  # Frontend Node.js dependencies
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'natlionggg'
    labels:
      - 'dependencies'
      - 'frontend'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    open-pull-requests-limit: 5
    reviewers:
      - 'natlionggg'
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'ci(deps):'
      include: 'scope'
