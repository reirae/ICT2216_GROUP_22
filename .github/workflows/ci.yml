name: CI

permissions:
  contents: read
  security-events: write

# Continuous Integration for SecureBank (ICT2216 Group 22).
# Runs on every push and pull request to main so every change is linted,
# tested and built automatically before it can be merged.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit (production deps)
        run: npm run audit:deps

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        env:
          VITE_CFTS_SITE_KEY: ${{ secrets.VITE_CFTS_SITE_KEY }}
        run: npm run build

      # Preserve the existing pipeline's behaviour: publish the built bundle
      # as a downloadable artifact (used for deployment) on main only.
      - name: Upload frontend build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: securebank-frontend-dist
          path: frontend/dist

  security:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_CHECK_VERSION: 12.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Node.js analyzers use npm when inspecting package-lock.json files.
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set dependency database cache key
        id: dependency-check-cache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: dependency-check-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ steps.dependency-check-cache-key.outputs.date }}
          restore-keys: |
            dependency-check-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}-

      - name: Install OWASP Dependency-Check
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/dependency-check/DependencyCheck/releases/download/v${DEPENDENCY_CHECK_VERSION}/dependency-check-${DEPENDENCY_CHECK_VERSION}-release.zip" \
            --output dependency-check.zip
          unzip -q dependency-check.zip
          rm dependency-check.zip

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=(
            --project "SecureBank"
            --scan "${GITHUB_WORKSPACE}/backend/package-lock.json"
            --scan "${GITHUB_WORKSPACE}/frontend/package-lock.json"
            --suppression "${GITHUB_WORKSPACE}/security/dependency-check-suppression.xml"
            --disableAssembly
            --disableYarnAudit
            --disableOssIndex
            --format ALL
            --out "${GITHUB_WORKSPACE}/dependency-check-reports"
            --data "$HOME/.dependency-check/data"
            --failOnCVSS 7
          )
          if [ -n "$NVD_API_KEY" ]; then
            args+=(--nvdApiKey "$NVD_API_KEY")
          fi
          ./dependency-check/bin/dependency-check.sh "${args[@]}"

      - name: Upload OWASP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-reports
          path: dependency-check-reports/
          if-no-files-found: warn

      - name: Upload OWASP SARIF to GitHub Security
        if: always() && hashFiles('dependency-check-reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dependency-check-reports/dependency-check-report.sarif

  deploy:
    name: Deploy production
    needs: [backend, frontend, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tested frontend build
        uses: actions/download-artifact@v4
        with:
          name: securebank-frontend-dist
          path: release/frontend/dist

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies and compile email templates
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Package backend
        run: |
          mkdir -p release/backend
          cp -R backend/src release/backend/src
          cp -R backend/dist release/backend/dist
          cp backend/package.json backend/package-lock.json release/backend/
          tar -C release -czf securebank-${GITHUB_SHA}.tar.gz .

      - name: Configure SSH
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$PROD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$PROD_PORT" \
            "securebank-${GITHUB_SHA}.tar.gz" \
            "$PROD_USER@$PROD_HOST:/tmp/securebank-${GITHUB_SHA}.tar.gz"

      - name: Activate release
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PORT: ${{ secrets.PROD_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$PROD_PORT" "$PROD_USER@$PROD_HOST" \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          app=/var/www/securebank
          release="$app/releases/$sha"

          test -f "$app/shared/backend.env"
          mkdir -p "$release"
          tar -xzf "/tmp/securebank-$sha.tar.gz" -C "$release"
          rm "/tmp/securebank-$sha.tar.gz"
          ln -sf "$app/shared/backend.env" "$release/backend/.env"

          cd "$release/backend"
          npm ci --omit=dev

          ln -sfn "$release" "$app/current"
          pm2 delete securebank-api 2>/dev/null || true
          pm2 start "$app/current/backend/src/server.js" \
            --name securebank-api \
            --cwd "$app/current/backend"

          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4000/api/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              pm2 logs securebank-api --lines 50 --nostream
              exit 1
            fi
            sleep 2
          done
          pm2 save
          REMOTE
